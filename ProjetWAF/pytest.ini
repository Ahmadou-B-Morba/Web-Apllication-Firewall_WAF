[pytest]
# La suite de tests vit dans tests/.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marqueurs personnalisés.
markers =
    db: tests nécessitant une connexion PostgreSQL réelle
        (désélectionnés par défaut avec `-m "not db"`)

# Niveau de récursion : on reste dans le projet.
norecursedirs = mon_env .idea .git

# Affichage synthétique mais informatif.
addopts = -ra
